<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#070B14" />
  <defs>
    <linearGradient id="nexusGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" />
      <stop offset="0.5" stop-color="#3B82F6" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="70" y="70" width="372" height="372" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background subtle grid aura -->
  <circle cx="256" cy="256" r="180" stroke="#06B6D4" stroke-opacity="0.15" stroke-width="2" />
  <circle cx="256" cy="256" r="120" stroke="#3B82F6" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 8" />
  <!-- Central Nexus Monogram 'N' with diamond node matrix -->
  <g filter="url(#glow)">
    <path d="M160 360 V152 L352 360 V152" stroke="url(#nexusGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="160" cy="152" r="14" fill="#38BDF8" />
    <circle cx="352" cy="152" r="14" fill="#818CF8" />
    <circle cx="160" cy="360" r="14" fill="#06B6D4" />
    <circle cx="352" cy="360" r="14" fill="#A855F7" />
    <circle cx="256" cy="256" r="16" fill="#FFFFFF" />
  </g>
</svg>
